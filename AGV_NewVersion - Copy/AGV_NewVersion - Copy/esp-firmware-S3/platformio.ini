; PlatformIO Project Configuration File
; Target: ESP32-S3 DevKitC-1
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; Platform chính thức espressif32 — hỗ trợ ESP32-S3 ổn định
platform  = espressif32
framework = arduino
board     = esp32-s3-devkitc-1

; Flash mode: QIO 80MHz (mặc định cho S3 DevKitC-1)
board_build.flash_mode = qio
board_build.f_flash    = 80000000L

; --- Upload and Monitor ---
upload_protocol = esptool
upload_speed    = 460800
monitor_speed   = 115200

; USB-OTG Serial (ESP32-S3 DevKitC-1 dùng cổng USB bên trái — UART0)
; Nếu dùng USB-CDC thì đổi thành:
;   board_build.arduino.cdn_enable = 1
;   monitor_port = /dev/cu.usbmodem*

; --- Library Dependencies ---
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8

; --- Build Flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=0

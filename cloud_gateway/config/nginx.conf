# ─── Nginx config cho iot.tot360.com.vn ──────────────────────────────────────
# Đặt tại: /etc/nginx/sites-available/iot.tot360.com.vn
# Sau khi tạo file, chạy:
#   ln -s /etc/nginx/sites-available/iot.tot360.com.vn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    server_name iot.tot360.com.vn;

    # Cert được certbot tự tạo và điền — chạy: certbot --nginx -d iot.tot360.com.vn
    ssl_certificate     /etc/letsencrypt/live/iot.tot360.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.tot360.com.vn/privkey.pem;

    # Toàn bộ request → Cloud API Gateway (gateway.py)
    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name iot.tot360.com.vn;
    return 301 https://$host$request_uri;
}

; PlatformIO Project Configuration File
; ESP32-C5 AGV MQTT Bridge

[env:esp32-c5-custom]
; pioarduino — Arduino ESP32 3.3.7 / ESP-IDF 5.5.2 (hỗ trợ ESP32-C5 RISC-V)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board     = esp32-c5-devkitc-1

; --- Upload / Monitor ---
upload_protocol = esptool
upload_speed    = 460800
monitor_speed   = 115200

; --- Build flags ---
; Không dùng ARDUINO_USB_CDC_ON_BOOT — ESP32-C5 devkitc-1 dùng chip USB-UART bridge
; (native USB CDC chưa ổn định trên pioarduino C5, gây lỗi USBSerial undeclared)
build_flags =
    -DCORE_DEBUG_LEVEL=1

; --- Libraries ---
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8

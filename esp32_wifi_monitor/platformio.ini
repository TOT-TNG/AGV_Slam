; WiFi Signal Monitor — build qua PlatformIO (framework ESP-IDF gốc), dùng
; chung 1 bộ source (main/) cho nhiều loại chip:
;   - esp32-c5-devkitc-1        : ESP32-C5, hỗ trợ 5GHz thật (mục tiêu chính)
;   - esp32-s3-devkitc1-n16r8   : ESP32-S3, chỉ có 2.4GHz — dùng để so sánh
;     song song 2.4GHz/5GHz trên cùng dashboard (nhiều thiết bị cùng lúc)
; main.c/http_report.c tự chọn đúng băng tần theo CONFIG_SOC_WIFI_SUPPORT_5G
; (define theo target), không cần sửa code khi build cho chip khác.
;
; Board ESP32-C5-DevKitC-1 chỉ có trên fork pioarduino, chưa có ở bản
; platformio/platform-espressif32 chính thức (chip quá mới).

; Project là ESP-IDF gốc (source nằm ở main/, không phải src/ mặc định của
; PlatformIO) — khai báo lại src_dir để PlatformIO khỏi báo thiếu src/.
[platformio]
src_dir = main

[env]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = espidf
monitor_speed = 115200
; Bảng phân vùng mặc định (1MB app) không đủ chứa firmware — dùng bảng
; riêng cấp 3MB app, xem partitions.csv. Áp dụng chung cho mọi board.
board_build.partitions = partitions.csv

[env:esp32-c5-devkitc-1]
board = esp32-c5-devkitc-1

[env:esp32-s3-devkitc1-n16r8]
board = esp32-s3-devkitc1-n16r8

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Gzip ────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/woff2
        image/svg+xml;

    # ── Flutter SPA: mọi route đều về index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── index.html: không cache (luôn nhận version mới nhất) ────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Static assets: cache dài ngày ───────────────────────────
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Ẩn Nginx version ────────────────────────────────────────
    server_tokens off;
}

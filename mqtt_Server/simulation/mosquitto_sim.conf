# mosquitto_sim.conf — Broker MQTT RIÊNG cho mô phỏng fleet, KHÁC port với
# broker sản xuất thật (thường 1883). Không dùng chung config/port với broker
# thật để tránh mọi khả năng lẫn lệnh giữa xe ảo và AGV thật.
#
# Chạy (giữ cửa sổ này mở trong lúc dùng trang "Mô phỏng Fleet"):
#   mosquitto -c mosquitto_sim.conf -v
#
# Dừng: Ctrl+C trong cửa sổ đó, hoặc đóng cửa sổ.

listener 1884
allow_anonymous true

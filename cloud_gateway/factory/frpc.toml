# ─── frp Client config — VÍ DỤ THAM KHẢO, KHÔNG dùng trực tiếp ──────────────
# File này CHỈ để tham khảo cấu trúc — KHÔNG điền token thật vào đây và
# KHÔNG commit token thật lên git (ai đọc được repo cũng đọc được token).
#
# Để cài đặt frpc THẬT cho 1 nhà máy (bao gồm cả lần đầu và các nhà máy sau
# này), dùng script `deploy_frpc.ps1` trong cùng thư mục — script tự sinh
# file frpc.toml thật (không commit) vào C:\frp\, tự tải frpc.exe, tự cài
# Windows Service. Xem hướng dẫn ở đầu file deploy_frpc.ps1.
#
# Ví dụ:
#   .\deploy_frpc.ps1 -Subdomain "vietduc" -Token "<token thật lấy từ /etc/frp/frps.toml trên VPS>"

# Địa chỉ Cloud VPS
serverAddr = "iot.tot360.com.vn"
serverPort = 7500

# Token — PHẢI KHỚP với auth.token trong frps.toml trên cloud
auth.token = "THAY_BANG_SECRET_TOKEN_NGAU_NHIEN"

# Tự kết nối lại khi tunnel đứt
transport.heartbeatInterval = 10
transport.heartbeatTimeout  = 30

[[proxies]]
name      = "agv-local"
type      = "http"
localIP   = "127.0.0.1"
localPort = 8000           # port FastAPI local (mqtt_Server)

subdomain  = "CHANGE_ME"
# *** THAY ĐỔI CHO MỖI NHÀ MÁY ***
# Phải khớp với "frp_host" trong factories.json trên cloud

